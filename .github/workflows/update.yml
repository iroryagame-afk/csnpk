name: Update dashboard data

on:
  schedule:
    # 13:45 UTC Mon-Fri = 21:45 Beijing time on weekdays
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data.js
        run: python scripts/build_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- korea-deleveraging/data.js; then
            echo "no data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea-deleveraging/data.js
          git commit -m "Update korea deleveraging snapshot"
          git push
