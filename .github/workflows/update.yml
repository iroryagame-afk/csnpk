name: Update dashboard data

on:
  schedule:
    # 13:45 UTC Mon-Fri = 21:45 Beijing time on weekdays
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data.js
        run: python scripts/build_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- korea-deleveraging/data.js; then
            echo "no data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korea-deleveraging/data.js
          git commit -m "Update korea deleveraging snapshot"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "push failed after 3 attempts"
              exit 1
            fi

            sleep $((attempt * 10))

            # If main moved while this job was running, replay our commit.
            if git fetch origin main; then
              git rebase origin/main
            fi
          done
