<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>韩国去杠杆监控台</title>
<style>
  /* ---- static theme tokens (light / dark via prefers-color-scheme) ---- */
  :root{
    --kimi-font-sans:-apple-system,"SF Pro Text","Helvetica Neue","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    --kimi-font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    --kimi-color-text-primary:#1c1c1e;
    --kimi-color-text-secondary:#4a4a4f;
    --kimi-color-text-tertiary:#8e8e93;
    --kimi-color-text-quaternary:#b9b9be;
    --kimi-color-surface:#ffffff;
    --kimi-color-danger:#d6303e;
    --kimi-color-warning:#d99526;
    --kimi-color-positive:#2f9e4f;
    --page-bg:#f6f6f4;
  }
  html[data-theme="dark"]{
    --kimi-color-text-primary:#f2f2f5;
    --kimi-color-text-secondary:#c9c9ce;
    --kimi-color-text-tertiary:#8e8e96;
    --kimi-color-text-quaternary:#5c5c63;
    --kimi-color-surface:#1d1d20;
    --kimi-color-danger:#ff5b66;
    --kimi-color-warning:#f0b23f;
    --kimi-color-positive:#4cc36b;
    --page-bg:#131315;
  }

  /* ---- construction grid ---- */
  .kimi-construction-grid{
    --kimi-grid-cell:48px;
    --kimi-grid-vertical-strength:4%;
    --kimi-grid-horizontal-strength:2%;
    background-image:
      linear-gradient(to right,color-mix(in srgb,var(--kimi-color-text-primary) var(--kimi-grid-vertical-strength),transparent) 1px,transparent 1px),
      linear-gradient(to bottom,color-mix(in srgb,var(--kimi-color-text-primary) var(--kimi-grid-horizontal-strength),transparent) 1px,transparent 1px);
    background-position:var(--kimi-grid-origin-x,0) var(--kimi-grid-origin-y,0);
    background-size:var(--kimi-grid-cell) var(--kimi-grid-cell);
  }
  html[data-theme="dark"] .kimi-construction-grid{--kimi-grid-vertical-strength:5%;--kimi-grid-horizontal-strength:2.5%}

  /* ---- layout ---- */
  html,body{margin:0;padding:0;background:var(--page-bg)}
  *{letter-spacing:0;box-sizing:border-box}
  .stage{
    font-family:var(--kimi-font-sans);
    color:var(--kimi-color-text-primary);
    --kimi-grid-origin-x:16px;
    --kimi-grid-origin-y:16px;
    line-height:1.45;
    position:relative;isolation:isolate;overflow:hidden;
    max-width:920px;margin:0 auto;min-height:100vh;
  }
  .mono{font-family:var(--kimi-font-mono)}
  .pixel-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;color:var(--kimi-color-text-quaternary)}
  .pixel-bg>canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
  .content{position:relative;z-index:1;padding:0 16px 20px;display:flex;flex-direction:column;gap:14px}

  /* header */
  .head{display:flex;flex-direction:column;justify-content:center;gap:6px;padding-top:16px}
  .eyebrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--kimi-color-text-tertiary)}
  .eyebrow .asof{font-size:11.5px;color:var(--kimi-color-text-secondary);font-weight:500}
  .runflag{font-size:11px;color:var(--kimi-color-text-tertiary)}
  .homelink{margin-inline-start:auto;font-size:11.5px;color:var(--kimi-color-text-tertiary);text-decoration:none}
  .homelink:hover{color:var(--kimi-color-text-primary)}
  .stale-banner{
    font-size:12px;line-height:1.4;color:var(--kimi-color-warning);
    background:color-mix(in srgb,var(--kimi-color-warning) 10%,transparent);
    border-inline-start:2px solid var(--kimi-color-warning);
    padding:6px 10px;border-radius:4px;
  }

  /* P0 */
  .p0{
    background:color-mix(in srgb,var(--kimi-color-surface) 62%,transparent);
    border-radius:8px;padding:10px 12px 12px;
  }
  .lamp-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .lamp{inline-size:9px;block-size:9px;border-radius:50%;flex:none;background:var(--kimi-color-text-tertiary)}
  .lamp.red{background:var(--kimi-color-danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--kimi-color-danger) 18%,transparent)}
  .lamp.amber{background:var(--kimi-color-warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--kimi-color-warning) 18%,transparent)}
  .lamp.green{background:var(--kimi-color-positive);box-shadow:0 0 0 3px color-mix(in srgb,var(--kimi-color-positive) 18%,transparent)}
  .lamp-text{font-weight:500}
  .lamp-state{margin-inline-start:auto;font-size:11.5px;font-weight:500}
  .lamp-state.red{color:var(--kimi-color-danger)}
  .lamp-state.amber{color:var(--kimi-color-warning)}
  .lamp-state.green{color:var(--kimi-color-positive)}
  .p0-value-row{display:flex;align-items:baseline;gap:7px;margin-top:6px}
  .p0-value{display:inline-block;box-sizing:border-box;font-size:34px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
  .p0-unit{font-size:12.5px;color:var(--kimi-color-text-secondary)}
  .p0-label{margin:2px 0 0;font-size:12px;color:var(--kimi-color-text-secondary);font-variant-numeric:tabular-nums}
  .p0-label .down{color:var(--kimi-color-positive)}
  .p0-label .up{color:var(--kimi-color-danger)}

  /* progress rail */
  .rail-wrap{margin-top:10px}
  .rail{position:relative;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}
  .rail>i{aspect-ratio:2.6/1;border-radius:1.5px;background:color-mix(in srgb,var(--kimi-color-text-primary) 12%,transparent)}
  .rail>i.on{background:color-mix(in srgb,var(--kimi-color-text-primary) 78%,transparent)}
  .rail-marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--kimi-color-warning);border-radius:1px}
  .rail-marks{position:relative;height:14px;margin-top:5px;font-size:10.5px;color:var(--kimi-color-text-tertiary)}
  .rail-marks .m30{position:absolute;transform:translateX(-50%);color:var(--kimi-color-warning);white-space:nowrap}
  .rail-marks .mL{position:absolute;left:0}
  .rail-marks .mR{position:absolute;right:0}
  .rail-note{margin:3px 0 0;font-size:11.5px;color:var(--kimi-color-text-secondary);font-variant-numeric:tabular-nums}
  .verdict{margin:8px 0 0;font-size:12px;line-height:1.5;color:var(--kimi-color-text-secondary)}

  /* sections */
  .sec-title{margin:0 0 7px;font-size:12px;font-weight:500;color:var(--kimi-color-text-tertiary)}

  /* levels */
  .levels{display:flex;flex-direction:column}
  .level-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;border-top:1px solid color-mix(in srgb,var(--kimi-color-text-primary) 8%,transparent)}
  .level-row:first-of-type{border-top:none}
  .dot{inline-size:8px;block-size:8px;border-radius:50%;flex:none}
  .dot.red{background:var(--kimi-color-danger)}
  .dot.amber{background:var(--kimi-color-warning)}
  .dot.green{background:var(--kimi-color-positive)}
  .dot.grey{background:var(--kimi-color-text-quaternary)}
  .dot.hatch{background:repeating-linear-gradient(135deg,var(--kimi-color-warning) 0 1.5px,transparent 1.5px 3.5px);border:1px solid var(--kimi-color-warning);border-radius:2px}
  .level-name{font-weight:500;white-space:nowrap}
  .level-note{color:var(--kimi-color-text-tertiary);font-size:11.5px;flex:1;min-width:0}
  .level-state{font-size:11px;font-weight:500;white-space:nowrap}
  .level-state.red{color:var(--kimi-color-danger)}
  .level-state.amber{color:var(--kimi-color-warning)}
  .level-state.green{color:var(--kimi-color-positive)}
  .level-state.grey{color:var(--kimi-color-text-quaternary)}

  /* gates chips */
  .chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .chip{border:1px solid color-mix(in srgb,var(--kimi-color-text-primary) 10%,transparent);border-radius:6px;padding:6px 9px;font-size:11.5px;display:flex;align-items:baseline;justify-content:space-between;gap:6px;background:color-mix(in srgb,var(--kimi-color-surface) 55%,transparent)}
  .chip .nm{color:var(--kimi-color-text-secondary)}
  .chip .ct{font-weight:500;font-variant-numeric:tabular-nums}
  .chip.bad .ct{color:var(--kimi-color-danger)}
  .chip.mid .ct{color:var(--kimi-color-warning)}
  .chip.ok .ct{color:var(--kimi-color-positive)}

  /* metrics */
  .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .metric{border-top:2px solid color-mix(in srgb,var(--kimi-color-text-primary) 16%,transparent);padding-top:6px}
  .metric.warn{border-top-color:color-mix(in srgb,var(--kimi-color-warning) 55%,transparent)}
  .metric.bad{border-top-color:color-mix(in srgb,var(--kimi-color-danger) 55%,transparent)}
  .metric .v{display:block;font-size:16.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
  .metric .l{display:block;font-size:11px;color:var(--kimi-color-text-tertiary);margin-top:1px}

  /* gates detail */
  .gates-detail{display:grid;grid-template-columns:1fr;gap:12px}
  .gate h3{margin:0 0 5px;font-size:12px;font-weight:500;color:var(--kimi-color-text-secondary)}
  .gate h3 .ct{font-variant-numeric:tabular-nums;color:var(--kimi-color-text-tertiary);font-weight:400}
  .gate ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .gate li{display:flex;align-items:baseline;gap:7px;font-size:12px}
  .gm{flex:none;inline-size:14px;text-align:center;font-weight:500}
  .gm.y{color:var(--kimi-color-positive)}
  .gm.n{color:var(--kimi-color-danger)}
  .gm.u{color:var(--kimi-color-text-quaternary)}
  .gate .gl{color:var(--kimi-color-text-primary)}
  .gate .gv{margin-inline-start:auto;font-size:11.5px;color:var(--kimi-color-text-tertiary);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* charts */
  .charts{display:grid;grid-template-columns:1fr;gap:14px}
  .chart{border-top:1px solid color-mix(in srgb,var(--kimi-color-text-primary) 8%,transparent);padding-top:8px;margin:0}
  .chart figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px}
  .chart .ct-name{color:var(--kimi-color-text-secondary);font-weight:500}
  .chart .ct-val{font-variant-numeric:tabular-nums;color:var(--kimi-color-text-tertiary);font-size:11.5px;white-space:nowrap}
  .chart svg{display:block;width:100%;height:auto}
  .chart .grid-l{stroke:color-mix(in srgb,var(--kimi-color-text-primary) 14%,transparent);stroke-width:1}
  .chart .th-l{stroke:var(--kimi-color-text-tertiary);stroke-width:1;stroke-dasharray:4 3}
  .chart .th-t{fill:var(--kimi-color-text-tertiary);font-size:9px}
  .chart .fin-l{fill:none;stroke:var(--kimi-color-text-primary);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  .chart .fin-a{fill:color-mix(in srgb,var(--kimi-color-text-primary) 6%,transparent);stroke:none}
  .chart .fin-pt{fill:var(--kimi-color-text-primary)}
  .chart .fin-v{fill:var(--kimi-color-text-primary);font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
  .chart .ax-t{fill:var(--kimi-color-text-quaternary);font-size:9px}
  .chart .bar-p{fill:color-mix(in srgb,var(--kimi-color-danger) 72%,transparent)}
  .chart .bar-n{fill:color-mix(in srgb,var(--kimi-color-positive) 72%,transparent)}
  .chart .zero-l{stroke:color-mix(in srgb,var(--kimi-color-text-primary) 20%,transparent);stroke-width:1}

  /* footer */
  .foot{font-size:10.5px;line-height:1.55;color:var(--kimi-color-text-quaternary);border-top:1px solid color-mix(in srgb,var(--kimi-color-text-primary) 8%,transparent);padding-top:8px}
  .err-banner{font-size:12px;color:var(--kimi-color-danger);background:color-mix(in srgb,var(--kimi-color-danger) 9%,transparent);border-inline-start:2px solid var(--kimi-color-danger);padding:6px 10px;border-radius:4px}

  /* width layouts */
  @media (min-width:520px){
    .metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
    .gates-detail{grid-template-columns:repeat(3,minmax(0,1fr))}
    .p0-value{font-size:38px}
  }
  @media (min-width:760px){
    .charts{grid-template-columns:repeat(2,minmax(0,1fr))}
    .content{gap:16px;padding:0 24px 28px}
    .p0-value{font-size:40px}
  }
</style>
</head>
<body>
<main class="stage kimi-construction-grid" data-pixel-stage>
  <div class="pixel-bg" id="pixelBg" aria-hidden="true"></div>
  <div class="content">

    <header class="head">
      <div class="eyebrow">
        <span>韩国散户杠杆 · 收盘监控</span>
        <span class="asof mono" id="asofTag">等待数据</span>
        <span class="runflag" id="runFlag" hidden>更新中…</span>
        <a class="homelink" href="../">← csnpk</a>
      </div>
      <div class="stale-banner" id="staleBanner" hidden></div>
      <div class="err-banner" id="errBanner" hidden>实时刷新失败，以下为最近一次成功快照。</div>
    </header>

    <section class="p0" aria-labelledby="p0group">
      <div class="lamp-row">
        <span class="lamp" id="lamp"></span>
        <span class="lamp-text" id="lampText">一级 · 散户资产负债表清算</span>
        <span class="lamp-state" id="lampState">—</span>
      </div>
      <div class="p0-value-row">
        <output class="p0-value" id="finValue">—</output>
        <span class="p0-unit">万亿韩元</span>
      </div>
      <p class="p0-label" id="p0group">信用融资余额 · <span id="finDelta">—</span></p>
      <div class="rail-wrap">
        <div class="rail" id="rail" role="img" aria-label="信用融资出清进度"></div>
        <div class="rail-marks">
          <span class="mL" id="railPeak">峰值 —</span>
          <span class="m30" id="railM30">30 观察线</span>
          <span class="mR">28 出清线</span>
        </div>
        <p class="rail-note" id="railNote">—</p>
      </div>
      <p class="verdict" id="verdict"></p>
    </section>

    <section class="levels" aria-label="三级风险状态">
      <h2 class="sec-title">三级风险</h2>
      <div class="level-row" id="lv1"></div>
      <div class="level-row" id="lv2"></div>
      <div class="level-row" id="lv3"></div>
    </section>

    <section aria-label="三道门摘要">
      <div class="chips" id="chips"></div>
    </section>

    <section class="metrics" aria-label="关键指标" id="metrics"></section>

    <section aria-label="三道门明细">
      <h2 class="sec-title">三道门 · 到位条件</h2>
      <div class="gates-detail" id="gatesDetail"></div>
    </section>

    <section class="charts" aria-label="走势">
      <figure class="chart" id="finChart">
        <figcaption>
          <span class="ct-name">信用融资余额 · 近90交易日</span>
          <span class="ct-val" id="finChartVal"></span>
        </figcaption>
        <div id="finSvg"></div>
      </figure>
      <figure class="chart" id="etfChart">
        <figcaption>
          <span class="ct-name">杠杆ETF净申赎 · 近60日（亿韩元）</span>
          <span class="ct-val" id="etfChartVal"></span>
        </figcaption>
        <div id="etfSvg"></div>
      </figure>
    </section>

    <footer class="foot" id="foot">
      源：KIM Premium（KOFIA FreeSIS / SEIBro / Naver 日频）。二级（券商CP续发、期限、利差）与三级（外汇掉期、银行间、央行工具）数据本站不含，标记“未核验”，不从股市下跌自动推导金融危机。
    </footer>
  </div>
</main>

<script src="data.js"></script>
<script>
/* ---- kimi-pixel-field.js (dependency-free renderer) ---- */
(function (global) {
  'use strict';
  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
  function seeded(seed) {
    let state = (Number(seed) || 1) >>> 0;
    return function next() { state = (state * 1664525 + 1013904223) >>> 0; return state / 4294967296; };
  }
  function densityAt(mode, x, y, config) {
    if (mode === 'contour') { const curve = 0.5 + Math.sin(x * Math.PI * 2) * 0.16; return clamp(1 - Math.abs(y - curve) * 7, 0, 1); }
    if (mode === 'directional') {
      const angle = (Number(config.flowAngleDeg) || 0) * Math.PI / 180;
      const dx = x - 0.5, dy = y - 0.5;
      const along = dx * Math.cos(angle) + dy * Math.sin(angle);
      const across = -dx * Math.sin(angle) + dy * Math.cos(angle);
      const lane = 1 - Math.abs(across) * 4.4;
      return clamp(lane * 0.72 + (along + 0.7) * 0.2, 0, 1);

    if (mode === 'atmosphere') { const dx = x - 0.72, dy = y - 0.42; return clamp(1 - Math.sqrt(dx * dx + dy * dy) * 2.1, 0, 1); }
    return clamp(0.12 + x * 0.88, 0, 1);
  }
  function mount(container, options) {
    if (!container || typeof container.appendChild !== 'function') throw new TypeError('KimiPixelField.mount requires a container element');
    const config = Object.assign({ mode:'density', mark:'ascii', seed:7, spacing:14, opacity:0.42, pointer:true, pointerTarget:null,
      pointerRadius:96, pointerStrength:14, pointerMode:'repel', flowAngleDeg:0, driftSpeed:0, variance:0.34, tier:'regular', characters:'.:+*#' }, options || {});
    const pointerTarget = config.pointerTarget && typeof config.pointerTarget.addEventListener === 'function' ? config.pointerTarget : container;
    const canvas = (container.ownerDocument || global.document).createElement('canvas');
    const context = canvas.getContext('2d');
    if (!context) throw new Error('KimiPixelField requires Canvas 2D');
    canvas.setAttribute('aria-hidden', 'true');
    Object.assign(canvas.style, { position:'absolute', inset:'0', width:'100%', height:'100%', pointerEvents:'none', zIndex:'0' });
    container.appendChild(canvas);
    const media = typeof global.matchMedia === 'function' ? global.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
    const reduced = media.matches;
    let marks = [], pointer = null, frame = 0, visible = true, destroyed = false;
    function dimensions() { const rect = container.getBoundingClientRect(); return { width: Math.max(1, rect.width), height: Math.max(1, rect.height) }; }
    function rebuild() {

      const ratio = Math.min(global.devicePixelRatio || 1, 2);

      context.setTransform(ratio, 0, 0, ratio, 0, 0);

      const variance = clamp(Number.isFinite(Number(config.variance)) ? Number(config.variance) : 0.34, 0, 0.9);

    function drawMark(mark, x, y) {

      else if (config.mark === 'cell') { context.strokeRect(x - radius, y - radius, radius * 2, radius * 2); }

    function draw(timestamp) {
      if (destroyed || !visible) return;
      const size = dimensions();
      context.clearRect(0, 0, size.width, size.height);
      const color = config.color || global.getComputedStyle(container).color;
      context.fillStyle = color; context.strokeStyle = color;
      const flowAngle = (Number(config.flowAngleDeg) || 0) * Math.PI / 180;
      const driftDistance = reduced ? 0 : ((Number(timestamp) || 0) / 1000) * (Number(config.driftSpeed) || 0);
      for (const mark of marks) {
        let x = mark.x + Math.cos(flowAngle) * driftDistance, y = mark.y + Math.sin(flowAngle) * driftDistance;
        x = ((x % size.width) + size.width) % size.width; y = ((y % size.height) + size.height) % size.height;

    function animate(timestamp) { frame = 0; draw(timestamp); if (!destroyed && visible && !reduced && Number(config.driftSpeed)) frame = global.requestAnimationFrame(animate); }
    function requestDraw() { if (!frame) frame = global.requestAnimationFrame(animate); }
    function onPointer(event) { if (!config.pointer || reduced) return; const rect = container.getBoundingClientRect(); pointer = { x: event.clientX - rect.left, y: event.clientY - rect.top }; requestDraw(); }
    function onLeave() { pointer = null; if (Number(config.driftSpeed) && !reduced) requestDraw(); else draw(); }
    const Resize = global.ResizeObserver;
    const resizeObserver = Resize ? new Resize(rebuild) : null;
    resizeObserver && resizeObserver.observe(container);
    pointerTarget.addEventListener('pointermove', onPointer, { passive: true });
    pointerTarget.addEventListener('pointerleave', onLeave, { passive: true });
    rebuild();
    if (Number(config.driftSpeed) && !reduced) requestDraw();
    return { canvas, render: draw, resize: rebuild,
      destroy: function () {
        destroyed = true;
        if (frame) global.cancelAnimationFrame(frame);
        resizeObserver && resizeObserver.disconnect();
        pointerTarget.removeEventListener('pointermove', onPointer);
        pointerTarget.removeEventListener('pointerleave', onLeave);
        canvas.remove();
      } };
  }
  global.KimiPixelField = { mount: mount };
})(window);
</script>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var field = null;

  /* theme: follow OS preference */
  function syncTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (field) field.render();
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', syncTheme);
  }

  function fmt(n, d) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function pct(n, d, sign) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    var v = fmt(n, d === undefined ? 1 : d);
    return sign && n > 0 ? '+' + v : v;
  }

  /* ---------- pixel field ---------- */
  function mountField(kpi) {
    var host = $('pixelBg');
    if (field) { try { field.destroy(); } catch (e) {} field = null; }
    var liqPct = kpi && isFinite(kpi.liqPct) ? kpi.liqPct : 50;
    var flow = kpi && isFinite(kpi.etfFlow5d) ? kpi.etfFlow5d : 0;
    try {
      field = window.KimiPixelField.mount(host, {
        mode: 'directional', mark: 'ascii', characters: '.:+*#', seed: 11, spacing: 15, opacity: 0.34,
        flowAngleDeg: flow >= 0 ? 180 : 0,
        driftSpeed: 1.5 + (liqPct / 100) * 7.5,
        variance: 0.25 + (liqPct / 100) * 0.55,
        pointer: true,
        pointerTarget: document.querySelector('[data-pixel-stage]')
      });
      host.style.display = '';
    } catch (e) {
      field = null;
      host.style.display = 'none';
    }
  }

  /* ---------- levels ---------- */
  var LEVEL_META = [
    { id: 'lv1', key: 'l1', name: '一级 · 散户杠杆清算' },
    { id: 'lv2', key: 'l2', name: '二级 · 券商融资压力' },
    { id: 'lv3', key: 'l3', name: '三级 · 系统性金融压力' }
  ];
  function stateClass(s) {
    if (s === 'red') return 'red';
    if (s === 'amber' || s === 'unverified') return 'amber';
    if (s === 'green') return 'green';
    return 'grey';
  }
  function renderLevels(levels) {
    LEVEL_META.forEach(function (m) {
      var lv = levels[m.key] || { state: 'grey', label: '—', note: '' };
      var cls = stateClass(lv.state);
      var dotCls = lv.state === 'unverified' ? 'hatch' : cls;
      $(m.id).innerHTML =
        '<span class="dot ' + dotCls + '" aria-hidden="true"></span>' +
        '<span class="level-name">' + m.name + '</span>' +
        '<span class="level-note">' + (lv.note || '') + '</span>' +
        '<span class="level-state ' + cls + '">' + (lv.label || '—') + '</span>';
    });
    var l1 = levels.l1 || {};
    var lampCls = stateClass(l1.state);
    $('lamp').className = 'lamp ' + lampCls;
    $('lampState').className = 'lamp-state ' + lampCls;
    $('lampState').textContent = l1.label || '—';
  }

  /* ---------- gates ---------- */
  var GATE_META = [
    { key: 'quantity', name: '数量门' },
    { key: 'capitulation', name: '投降门' },
    { key: 'price', name: '价格确认门' }
  ];
  function gateCount(g) {
    var known = 0, passed = 0;
    (g.items || []).forEach(function (it) { if (it.verified !== false) { known++; if (it.pass) passed++; } });
    return { passed: passed, known: known, total: (g.items || []).length };
  }
  function renderChips(gates) {
    $('chips').innerHTML = GATE_META.map(function (m) {
      var g = gates[m.key] || { items: [] };
      var c = gateCount(g);
      var cls = c.known === 0 ? 'mid' : (c.passed === c.total ? 'ok' : (c.passed === 0 ? 'bad' : 'mid'));
      return '<div class="chip ' + cls + '"><span class="nm">' + m.name + '</span><span class="ct">' +
        c.passed + '/' + c.total + '</span></div>';
    }).join('');
  }
  function renderGateDetail(gates) {
    $('gatesDetail').innerHTML = GATE_META.map(function (m) {
      var g = gates[m.key] || { passed: 0, total: 0, items: [] };
      var rows = (g.items || []).map(function (it) {
        var mk = it.verified === false ? '<span class="gm u">—</span>' : (it.pass ? '<span class="gm y">✓</span>' : '<span class="gm n">✗</span>');
        return '<li>' + mk + '<span class="gl">' + it.label + '</span><span class="gv">' + (it.value || '') + '</span></li>';
      }).join('');
      return '<div class="gate"><h3>' + m.name + ' <span class="ct">' + g.passed + '/' + g.total + '</span></h3><ul>' + rows + '</ul></div>';
    }).join('');
  }

  /* ---------- metrics ---------- */
  function renderMetrics(k) {
    var cells = [
      { v: pct(k.r2, 2) + '%', l: '融资/存管金 · 观察线 28%', cls: k.r2 < 28 ? '' : 'bad' },
      { v: pct(k.etfFlow5d, 2, true) + ' 万亿', l: '杠杆ETF 5日净申赎' + (k.etfFlow5d > 0 ? ' · 逆势申购' : ' · 转为赎回'), cls: k.etfFlow5d > 0 ? 'bad' : '' },
      { v: fmt(k.liq5d, 0) + ' 亿', l: '强平5日均值 · 10年' + fmt(k.liqPct, 0) + '分位', cls: k.liqPct >= 90 ? 'warn' : '' },
      { v: fmt(k.kospi, 1), l: 'KOSPI · 当日 ' + pct(k.kospiChgPct, 2, true) + '%', cls: '' }
    ];
    $('metrics').innerHTML = cells.map(function (c) {
      return '<div class="metric ' + c.cls + '"><span class="v">' + c.v + '</span><span class="l">' + c.l + '</span></div>';
    }).join('');
  }

  /* ---------- rail ---------- */
  var RAIL_N = 24;
  function renderRail(k) {
    var rail = $('rail');
    var filled = Math.round(Math.max(0, Math.min(100, k.progressPct)) / 100 * RAIL_N);
    var html = '';
    for (var i = 0; i < RAIL_N; i++) html += '<i class="' + (i < filled ? 'on' : '') + '"></i>';
    rail.innerHTML = html;
    var span = k.finPeak - 28;
    var m30 = span > 0 ? (k.finPeak - 30) / span * 100 : 80;
    m30 = Math.max(4, Math.min(96, m30));
    rail.insertAdjacentHTML('beforeend', '<span class="rail-marker" style="left:' + m30 + '%"></span>');
    $('railM30').style.left = m30 + '%';
    $('railPeak').textContent = '峰值 ' + fmt(k.finPeak, 1);
    $('railNote').textContent = '出清 ' + fmt(k.progressPct, 1) + '% · 距 30 万亿观察线还差 ' +
      fmt(k.fin - 30, 2) + ' 万亿（再降 ' + fmt(k.dist30Pct, 1) + '%）';
  }

  /* ---------- charts ---------- */
  function finChart(s, k) {
    var d = s.d, v = s.v, n = d.length;
    if (!n) return '';
    var W = 340, H = 132, pl = 6, pr = 56, pt = 12, pb = 16;
    var lo = Math.min(Math.min.apply(null, v), 28) - 1;
    var hi = Math.max(Math.max.apply(null, v), k.finPeak) + 1;
    var X = function (i) { return pl + (W - pl - pr) * i / (n - 1); };
    var Y = function (x) { return pt + (H - pt - pb) * (1 - (x - lo) / (hi - lo)); };
    var pts = v.map(function (x, i) { return X(i).toFixed(1) + ',' + Y(x).toFixed(1); });
    var area = 'M' + X(0) + ',' + Y(lo) + 'L' + pts.join('L') + 'L' + X(n - 1) + ',' + Y(lo) + 'Z';
    var line = 'M' + pts.join('L');
    function th(val, label) {
      var y = Y(val);
      return '<line class="th-l" x1="' + pl + '" y1="' + y + '" x2="' + (W - pr + 4) + '" y2="' + y + '"/>' +
        '<text class="th-t" x="' + (W - pr + 8) + '" y="' + (y + 3) + '">' + label + '</text>';
    }
    var lx = X(n - 1), ly = Y(v[n - 1]);
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="信用融资余额近90交易日走势">' +
      '<path class="fin-a" d="' + area + '"/>' +
      th(30, '30 观察线') + th(28, '28 出清线') +
      '<path class="fin-l" d="' + line + '"/>' +
      '<circle class="fin-pt" cx="' + lx + '" cy="' + ly + '" r="2.6"/>' +
      '<text class="fin-v" x="' + Math.min(lx - 34, W - pr - 20) + '" y="' + (ly - 7) + '">' + fmt(v[n - 1], 2) + '</text>' +
      '<text class="ax-t" x="' + pl + '" y="' + (H - 3) + '">' + d[0].slice(5) + '</text>' +
      '<text class="ax-t" x="' + (W - pr - 26) + '" y="' + (H - 3) + '">' + d[n - 1].slice(5) + '</text>' +
      '</svg>';
  }
  function etfChart(s) {
    var d = s.d, v = s.v, n = d.length;
    if (!n) return '';
    var W = 340, H = 104, pl = 6, pr = 6, pt = 8, pb = 14;
    var mx = Math.max.apply(null, v.map(function (x) { return Math.abs(x); })) || 1;
    var Y0 = pt + (H - pt - pb) / 2;
    var bw = (W - pl - pr) / n;
    var bars = v.map(function (x, i) {
      var h = Math.abs(x) / mx * (H - pt - pb) / 2;
      var y = x >= 0 ? Y0 - h : Y0;
      return '<rect class="' + (x >= 0 ? 'bar-p' : 'bar-n') + '" x="' + (pl + i * bw + 0.5).toFixed(1) +
        '" y="' + y.toFixed(1) + '" width="' + Math.max(1, bw - 1.2).toFixed(1) + '" height="' + Math.max(0.6, h).toFixed(1) + '"/>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="杠杆ETF每日净申赎近60日">' +
      bars +
      '<line class="zero-l" x1="' + pl + '" y1="' + Y0 + '" x2="' + (W - pr) + '" y2="' + Y0 + '"/>' +
      '<text class="ax-t" x="' + pl + '" y="' + (H - 2) + '">' + d[0].slice(5) + '</text>' +
      '<text class="ax-t" x="' + (W - 34) + '" y="' + (H - 2) + '">' + d[n - 1].slice(5) + '</text>' +
      '</svg>';
  }

  /* ---------- main render: m 为 artifact ---------- */
  function render(m) {
    if (!m || !m.kpi) {
      $('verdict').textContent = '等待数据：工作日 21:45（北京时间）自动刷新。';
      return;
    }
    var k = m.kpi;
    $('asofTag').textContent = '数据日期 ' + m.asof + ' · 网站生成 ' + m.generated;
    if (m.stale) {
      $('staleBanner').hidden = false;
      $('staleBanner').textContent = m.staleNote || '网站数据滞后，以下为最近可用读数，非今日数据。';
    } else { $('staleBanner').hidden = true; }

    $('finValue').textContent = fmt(k.fin, 2);
    $('finDelta').innerHTML = '较峰值 ' + fmt(k.finPeak, 2) + '（' + k.finPeakDate + '） <span class="down">' + fmt(k.finDdPct, 2) + '%</span>';
    renderRail(k);
    $('verdict').textContent = m.verdict || '';
    renderLevels(m.levels || {});
    renderChips(m.gates || {});
    renderMetrics(k);
    renderGateDetail(m.gates || {});
    $('finSvg').innerHTML = finChart(m.series.fin, k);
    $('finChartVal').textContent = '峰值 ' + fmt(k.finPeak, 1) + ' → 现 ' + fmt(k.fin, 1) + ' 万亿';
    $('etfSvg').innerHTML = etfChart(m.series.etfFlow);
    $('etfChartVal').textContent = '近5日 ' + pct(k.etfFlow5d, 2, true) + ' 万亿 · AUM ' + fmt(k.etfAum, 1) + ' 万亿';
    $('foot').innerHTML = '源：KIM Premium（KOFIA FreeSIS / SEIBro / Naver 日频）· 数据日期 ' + m.asof + ' · 网页生成 ' + m.generated +
      '。二级（券商CP续发、期限、利差）与三级（外汇掉期、银行间、央行工具）数据本站不含，标记“未核验”，不从股市下跌自动推导金融危机。';
    mountField(k);
  }

  /* ---------- 与 scripts/build_data.py 同逻辑的前端重算（实时刷新用） ---------- */
  function fmtDate(raw) {
    var s = String(raw);
    return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
  }
  function seoulNow() { return new Date(Date.now() + 9 * 3600 * 1000); } /* 用 UTC 字段读首尔时间 */
  function expectedTradingDay(now) {
    var d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
    if (now.getUTCHours() < 21 || (now.getUTCHours() === 21 && now.getUTCMinutes() < 30)) {
      d = new Date(d.getTime() - 86400000);
    }
    while (d.getUTCDay() === 0 || d.getUTCDay() === 6) d = new Date(d.getTime() - 86400000);
    return d;
  }
  function isoDay(d) {
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }
  function round(n, d) { var p = Math.pow(10, d); return Math.round(n * p) / p; }

  function computeArtifact(meta, series, etf) {
    var asof = fmtDate(meta.asof);
    var generated = meta.generated || '';
    var d = series.d, finS = series.fin, depS = series.dep, liqS = series.liq, liqRS = series.liqR, kospiS = series.kospi;
    var kpiM = meta.kpi;
    var fin = finS[finS.length - 1];
    var dep = depS[depS.length - 1];
    var r2 = kpiM.r2;
    var liqToday = liqS[liqS.length - 1];
    var liqR = liqRS[liqRS.length - 1];
    var liq5d = kpiM.liq5d;
    var liqPct = kpiM.liqPct;
    var kospi = kospiS[kospiS.length - 1];
    var kospiChg = (kospiS[kospiS.length - 1] / kospiS[kospiS.length - 2] - 1) * 100;

    var idx2026 = d.findIndex(function (x) { return String(x) >= '20260101'; });
    if (idx2026 < 0) idx2026 = 0;
    var peak = -Infinity, peakDate = '';
    for (var i = idx2026; i < d.length; i++) {
      if (finS[i] > peak) { peak = finS[i]; peakDate = fmtDate(d[i]); }
    }
    var finDd = (fin / peak - 1) * 100;
    var dist30 = (fin - 30) / fin * 100;
    var dist28 = (fin - 28) / fin * 100;
    var progress = Math.max(0, Math.min(100, (peak - fin) / (peak - 28) * 100));

    var etfFlow = etf.flow;
    var etfFlow5 = etfFlow.slice(-5).reduce(function (a, b) { return a + b; }, 0) / 10000;
    var etfAum = etf.kpi.aum;
    var depChg5 = depS[depS.length - 1] - depS[depS.length - 6];
    var kospiOk = kospi > Math.min.apply(null, kospiS.slice(-6, -1));

    var now = seoulNow();
    var exp = expectedTradingDay(now);
    var asofD = new Date(asof + 'T00:00:00Z');
    var stale = asofD.getTime() < exp.getTime();
    var staleNote = stale ?
      '网站数据停留在 ' + asof + '；' + isoDay(exp) + ' 读数尚未更新（或遇韩国休市）。以下为 ' + asof + ' 数据，请勿当作最新交易日读数。' : '';

    var f2 = function (x) { return x.toFixed(2); };
    var fp2 = function (x) { return (x >= 0 ? '+' : '') + x.toFixed(2); };

    var quantityItems = [
      { label: '信用融资进入 30 万亿以下', value: f2(fin) + ' 万亿', pass: fin < 30, verified: true },
      { label: '融资/存管金降到 28% 以下', value: f2(r2) + '%', pass: r2 < 28, verified: true },
      { label: '杠杆ETF近5日净申赎转负', value: fp2(etfFlow5) + ' 万亿', pass: etfFlow5 < 0, verified: true }
    ];
    var capitulationItems = [
      { label: '强平5日均值退出90分位以上', value: liqPct.toFixed(0) + ' 分位', pass: liqPct < 90, verified: true },
      { label: '散户停止逆势申购杠杆ETF', value: fp2(etfFlow5) + ' 万亿/5日', pass: etfFlow5 <= 0, verified: true },
      { label: '存管金不再快速流失', value: '5日 ' + fp2(depChg5) + ' 万亿', pass: depChg5 >= -1.0, verified: true }
    ];
    var priceItems = [
      { label: 'KOSPI 波动后不再创新低（5日）', value: kospi.toFixed(1), pass: !!kospiOk, verified: true },
      { label: '外资和机构抛售放缓', value: '需外资流向数据', pass: false, verified: false },
      { label: '半导体龙头不再承担提款机角色', value: '需个股资金流数据', pass: false, verified: false }
    ];
    function gate(items) {
      return { passed: items.filter(function (it) { return it.pass === true; }).length, total: items.length, items: items };
    }
    var gates = { quantity: gate(quantityItems), capitulation: gate(capitulationItems), price: gate(priceItems) };

    var l1;
    if (fin < 30 && r2 < 28 && etfFlow5 < 0) {
      l1 = { state: 'green', label: '基本出清', note: '融资 ' + fin.toFixed(1) + ' 万亿 · ETF 转净赎回' };
    } else if (liqPct >= 90 || etfFlow5 > 0) {
      var bits = ['融资较峰值 ' + finDd.toFixed(1) + '%'];
      if (etfFlow5 > 0) bits.push('ETF 仍净申购 ' + fp2(etfFlow5) + ' 万亿');
      if (liqPct >= 90) bits.push('强平 ' + liqPct.toFixed(0) + ' 分位');
      l1 = { state: 'red', label: '清算进行中', note: bits.join(' · ') };
    } else {
      l1 = { state: 'amber', label: '缓和未出清', note: '融资较峰值 ' + finDd.toFixed(1) + '%' };
    }
    var levels = {
      l1: l1,
      l2: { state: 'unverified', label: '未核验', note: '缺券商CP续发/期限/利差数据' },
      l3: { state: 'grey', label: '暂未证实', note: '未见外汇掉期·银行间·央行救助证据' }
    };

    var verdict;
    if (etfFlow5 > 0) {
      verdict = '显性融资较峰值下降 ' + Math.abs(finDd).toFixed(1) + '%，但杠杆ETF近5日仍净申购 ' + etfFlow5.toFixed(2) + ' 万亿——嵌入式杠杆继续增加，出清未完成。';
    } else {
      verdict = '显性融资较峰值下降 ' + Math.abs(finDd).toFixed(1) + '%，杠杆ETF近5日转为净赎回 ' + Math.abs(etfFlow5).toFixed(2) + ' 万亿，进入出清确认期，仍需数量门与价格门共振。';
    }
    verdict += ' 数量门 ' + gates.quantity.passed + '/3 · 投降门 ' + gates.capitulation.passed + '/3 · 价格门 ' + gates.price.passed + '/3。';

    var n90 = Math.min(90, d.length);
    var n60 = Math.min(60, etf.d.length);
    function rolling5(values) {
      var out = [];
      for (var i = 0; i < values.length; i++) {
        var win = values.slice(Math.max(0, i - 4), i + 1).filter(function (x) { return x !== null && x !== undefined; });
        out.push(win.length ? round(win.reduce(function (a, b) { return a + b; }, 0) / win.length, 1) : null);
      }
      return out;
    }
    var liq5dS = rolling5(liqS);

    return {
      asof: asof,
      generated: generated,
      stale: stale,
      staleNote: staleNote,
      verdict: verdict,
      kpi: {
        fin: round(fin, 3), finPeak: round(peak, 3), finPeakDate: peakDate,
        finDdPct: round(finDd, 2), dist30Pct: round(dist30, 2), dist28Pct: round(dist28, 2),
        progressPct: round(progress, 1), r2: r2, dep: round(dep, 3),
        liqToday: round(liqToday, 1), liq5d: liq5d, liqPct: liqPct, liqR: liqR,
        etfAum: etfAum, etfFlow5d: round(etfFlow5, 3),
        kospi: round(kospi, 2), kospiChgPct: round(kospiChg, 2)
      },
      levels: levels,
      gates: gates,
      series: {
        fin: { d: d.slice(-n90).map(fmtDate), v: finS.slice(-n90).map(function (x) { return round(x, 3); }) },
        liq5d: { d: d.slice(-n90).map(fmtDate), v: liq5dS.slice(-n90) },
        etfFlow: { d: etf.d.slice(-n60).map(fmtDate), v: etfFlow.slice(-n60).map(function (x) { return round(x, 1); }) }
      }
    };
  }

  /* ---------- 静默实时刷新：成功则重算重渲染，失败（CORS/网络）安静保留内联快照 ---------- */
  function tryLiveRefresh() {
    var BASE = 'https://kimpremium.com/data/';
    var names = ['meta.json', 'series.json', 'etf.json'];
    Promise.all(names.map(function (n) {
      return fetch(BASE + n, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      });
    })).then(function (rs) {
      var artifact = computeArtifact(rs[0], rs[1], rs[2]);
      if (artifact && artifact.kpi) render(artifact);
    }).catch(function () { /* 静默：保留 window.SNAPSHOT 内联快照 */ });
  }

  syncTheme();
  render(window.SNAPSHOT || null);
  tryLiveRefresh();
})();
</script>
</body>
</html>
